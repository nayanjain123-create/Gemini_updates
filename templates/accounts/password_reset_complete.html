{% extends "base.html" %}

{% block title %}Password Reset Complete - Gemini Insights{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 my-5">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 text-center">
    
    <div class="card card-stat border-0 shadow-lg p-4">
      <i class="bi bi-patch-check-fill fs-1 text-success mb-2"></i>
      <h3 class="fw-bold">Password Changed!</h3>
      <p class="text-muted">Your password has been set successfully. You can now sign in with your new password.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary fw-bold mt-3">Sign In Now</a>
    </div>

  </div>
</div>
{% endblock %}
