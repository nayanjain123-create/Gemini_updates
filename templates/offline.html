{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Gemini Insights</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA Meta & Icons -->
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="{% url 'pwa_manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icons/apple-touch-icon.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'pwa/icons/favicon-32x32.png' %}">
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/theme.css' %}" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0F172A 70%, #0B0F19 100%);
      color: #F8FAFC;
      padding: 1.5rem;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    .offline-card {
      max-width: 460px;
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: offlineFadeIn 0.5s ease-out;
    }
    @keyframes offlineFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .offline-icon-wrapper {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.25);
    }
    .offline-icon-wrapper i {
      font-size: 2.75rem;
      color: #F87171;
    }
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .brand-header img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .btn-retry {
      min-height: 48px;
      font-weight: 600;
      border-radius: 0.75rem;
      padding: 0.75rem 1.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="brand-header">
      <img src="{% static 'pwa/icons/icon-192x192.png' %}" alt="Gemini Insights Logo">
      <span class="fw-bold fs-5 tracking-wide text-white">Gemini Insights</span>
    </div>

    <div class="offline-icon-wrapper">
      <i class="bi bi-wifi-off"></i>
    </div>

    <h2 class="fs-4 fw-bold text-white mb-2">You are offline</h2>
    <p class="text-slate-400 text-muted fs-6 mb-4">
      Reconnect to view or submit reports. Your session is secure, and updates will be accessible once an active connection is restored.
    </p>

    <div class="d-grid gap-2">
      <a href="/" onclick="window.location.reload(); return false;" class="btn btn-primary btn-retry">
        <i class="bi bi-arrow-clockwise fs-5"></i> Retry Connection
      </a>
    </div>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 small text-muted">
      <span>Gemini Insights &bull; Work Tracking & Compliance</span>
    </div>
  </div>

  <script>
    // Auto-reload when network reconnects
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
