{% extends "base.html" %}

{% block title %}404 Page Not Found - Gemini Insights{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 my-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="card card-stat border-0 shadow-lg p-5">
      <i class="bi bi-compass-fill text-warning display-1 mb-3"></i>
      <h1 class="fw-bold">404 Page Not Found</h1>
      <p class="fs-5 text-muted mb-4">The page or resource you requested could not be found or has been moved.</p>
      <div>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary fw-bold px-4 py-2">
          <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
